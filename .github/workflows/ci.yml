name: Android CI

on:
  push:
    branches: [ "main", "spike/**", "feat/**" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: Build, Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.2.2

      - name: Grant execute permissions
        run: |
          chmod +x gradlew
          chmod +x ./scripts/prepare-runtime.sh

      - name: Prepare Deterministic Runtime AARs
        run: ./scripts/prepare-runtime.sh

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Run Android Lint
        run: ./gradlew lintDebug

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Prepare Threads Plugin Debug APK Artifact
        run: |
          mkdir -p build-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/SocialVideoDownloader-Android-ThreadsPlugin-debug.apk

      - name: Upload Threads Plugin Debug APK Artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: SocialVideoDownloader-Android-ThreadsPlugin-debug-run-${{ github.run_number }}
          path: build-artifacts/SocialVideoDownloader-Android-ThreadsPlugin-debug.apk
          retention-days: 7

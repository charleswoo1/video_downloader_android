name: Android Release Candidate

# Manual-only release candidate build.
# Run this only AFTER the reviewed release-prep PR has been merged into the default branch (main).
# workflow_dispatch is intentionally used from main so the validated RC commit is also the future tag target.
# This workflow creates a signed APK + SHA256SUMS.txt artifact.
# It NEVER creates a Git tag or GitHub Release.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-candidate:
    name: Build Signed Release Candidate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate release candidate source
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Release Candidate builds must be dispatched from main. Current ref: $GITHUB_REF"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.2.2

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Run Android Lint
        run: ./gradlew lintDebug

      - name: Validate release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_SIGNING_STORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Copy to deterministic filename
        run: |
          set -euo pipefail
          mkdir -p build-artifacts
          cp app/build/outputs/apk/release/app-release.apk \
            build-artifacts/SocialVideoDownloader-Android-v1.0.0.apk

      - name: Verify final APK signature
        run: |
          set -euo pipefail
          APK="build-artifacts/SocialVideoDownloader-Android-v1.0.0.apk"
          test -f "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"

      - name: Generate SHA256SUMS.txt
        run: |
          set -euo pipefail
          cd build-artifacts
          sha256sum SocialVideoDownloader-Android-v1.0.0.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Release Candidate
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: SocialVideoDownloader-Android-v1.0.0-RC-run-${{ github.run_number }}
          path: |
            build-artifacts/SocialVideoDownloader-Android-v1.0.0.apk
            build-artifacts/SHA256SUMS.txt
          retention-days: 7
